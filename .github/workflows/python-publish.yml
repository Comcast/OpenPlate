name: Publish Python Package

on:
  workflow_dispatch:
    inputs:
      semantic_version:
        description: Semantic version to publish, for example 1.2.3
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    container:
      image: python:3.12-bookworm

    env:
      PYPI_REPOSITORY_URL: ${{ vars.PYPI_REPOSITORY_URL }}
      PYPI_USERNAME: ${{ vars.PYPI_USERNAME || secrets.PYPI_USERNAME }}
      PYPI_PASSWORD: ${{ secrets.PYPI_PASSWORD || vars.PYPI_PASSWORD }}

    steps:
      - name: Validate semantic version input
        shell: bash
        env:
          INPUT_SEMANTIC_VERSION: ${{ github.event.inputs.semantic_version }}
          SEMVER_REGEX: '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-((?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*)(?:\.(?:0|[1-9]\d*|\d*[a-zA-Z-][0-9a-zA-Z-]*))*))?(?:\+([0-9a-zA-Z-]+(?:\.[0-9a-zA-Z-]+)*))?$'
        run: |
          set -euo pipefail

          python --version

          if [[ -z "${INPUT_SEMANTIC_VERSION}" ]]; then
            echo "semantic_version is required" >&2
            exit 1
          fi

          if ! python -c "import os, re, sys; sys.exit(0 if re.fullmatch(os.environ['SEMVER_REGEX'], os.environ['INPUT_SEMANTIC_VERSION']) else 1)"; then
            echo "semantic_version must match the Semantic Versioning 2.0.0 format: ${INPUT_SEMANTIC_VERSION}" >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate package publish configuration
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${PYPI_REPOSITORY_URL}" ]]; then
            echo "PYPI_REPOSITORY_URL must be configured as a repository variable" >&2
            exit 1
          fi

          if [[ -z "${PYPI_USERNAME}" || -z "${PYPI_PASSWORD}" ]]; then
            echo "PYPI_USERNAME and PYPI_PASSWORD must be configured as repository secrets or variables" >&2
            exit 1
          fi

      - name: Install build tooling
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build twine packaging

      - name: Stamp package version
        shell: bash
        env:
          INPUT_SEMANTIC_VERSION: ${{ github.event.inputs.semantic_version }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from packaging.version import Version
          import re

          semantic_version = os.environ["INPUT_SEMANTIC_VERSION"]
          package_version = str(Version(semantic_version))
          init_path = Path("src/openplate/__init__.py")
          content = init_path.read_text()

          content = re.sub(r'^__version__\s*=\s*".*"$', '', content, flags=re.MULTILINE)
          content = re.sub(r'^__semver__\s*=\s*".*"$', '', content, flags=re.MULTILINE)
          content = content.rstrip() + f'\n__version__ = "{package_version}"\n__semver__ = "{semantic_version}"\n'

          init_path.write_text(content)
          PY

      - name: Build package artifacts
        shell: bash
        run: |
          python -m build

      - name: Validate package artifacts
        shell: bash
        run: |
          python -m twine check dist/*

      - name: Verify built artifacts contain license files
        shell: bash
        run: |
          python - <<'PY'
          import tarfile
          import zipfile
          from pathlib import Path

          dist_dir = Path("dist")
          sdists = sorted(dist_dir.glob("*.tar.gz"))
          wheels = sorted(dist_dir.glob("*.whl"))

          if len(sdists) != 1 or len(wheels) != 1:
            raise SystemExit("Expected exactly one sdist and one wheel in dist/")

          with tarfile.open(sdists[0], "r:gz") as archive:
            members = archive.getnames()
            if not any(name.endswith("/LICENSE") for name in members):
              raise SystemExit("sdist is missing LICENSE")
            if not any(name.endswith("/NOTICE") for name in members):
              raise SystemExit("sdist is missing NOTICE")

          with zipfile.ZipFile(wheels[0]) as archive:
            members = archive.namelist()
            if not any(name.endswith(".dist-info/licenses/LICENSE") for name in members):
              raise SystemExit("wheel is missing LICENSE")
            if not any(name.endswith(".dist-info/licenses/NOTICE") for name in members):
              raise SystemExit("wheel is missing NOTICE")
          PY

      - name: Upload package artifacts
        env:
          TWINE_REPOSITORY_URL: ${{ env.PYPI_REPOSITORY_URL }}
          TWINE_USERNAME: ${{ env.PYPI_USERNAME }}
          TWINE_PASSWORD: ${{ env.PYPI_PASSWORD }}
          TWINE_NON_INTERACTIVE: '1'
        run: |
          python -m twine upload dist/*